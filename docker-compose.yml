version: '3.8'

services:
  backend:
    build:
      context: ./Rich4Backend
      dockerfile: Dockerfile
    container_name: rich4-backend
    ports:
      - "5285:5285"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5285
    networks:
      - rich4-network

  frontend:
    build:
      context: ./rich4-frontend
      dockerfile: Dockerfile
    container_name: rich4-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rich4-network

networks:
  rich4-network:
    driver: bridge
